# Per-finding proof-of-concept crate — TEMPLATE.
#
# The `poc-engineer` copies this whole `templates/poc/` directory to
# `audit_<n>/poc/F-xxx/` and fills the {PLACEHOLDERS}. One crate == one finding.
#
# The crate compiles the SAME entrypoint two ways, selected by a cargo feature:
#   --features vulnerable  → the minimized reproduction of the flaw (exploit lands)
#   --features fixed       → the flaw closed (same exploit is rejected)
# The two arms are mutually exclusive; `default = ["fixed"]` so a bare `cargo build`
# is the safe (patched) one.
#
# ── Fill these in ──────────────────────────────────────────────────────────────
#   {PROGRAM_NAME} : this crate's package name, snake_case, e.g. `poc_f_012_vault`.
#                    It is also the compiled .so base name, which run.sh reads
#                    from this manifest, so reuse the SAME token in the
#                    `mollusk_for(.., "{PROGRAM_NAME}")` calls in tests and in
#                    Cargo.lock's entry for this crate.
# ───────────────────────────────────────────────────────────────────────────────

[package]
name = "{PROGRAM_NAME}"
version = "0.1.0"
edition = "2021"
# The rustc of platform-tools v1.54, which run.sh builds the arms with. It reports
# 1.89.0-dev, which meets this.
rust-version = "1.89"
publish = false
license = "MIT"

# Its own workspace root, so cargo never looks for one in a parent directory: not
# above the scratch copy `run.sh` builds from, and not in the audited repo this
# crate sits in, whose own `[workspace]` would claim it and refuse to build it.
# Resolver 3 resolves a dependency that Cargo.lock does not pin yet to a release
# whose `rust-version` the toolchain above meets.
[workspace]
resolver = "3"

# `cdylib` so `cargo build-sbf` can emit the loadable `.so` Mollusk runs;
# `lib`   so the `tests/` can import this crate's types (state structs, ids).
[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["fixed"]
vulnerable = []
fixed = []

[dependencies]
# Framework crates by default, at the audited program's versions. Native example
# shown; for an Anchor target swap in `anchor-lang`/`anchor-spl`, for Pinocchio swap
# in `pinocchio`. A crate copied from the target's manifest runs its build script in
# the recorded execution mode, so add one only when the PoC needs it.
solana-program = "3"
borsh = "1"

[dev-dependencies]
# mollusk-svm loads a COMPILED .so, so the tests need an SBF build of the arm first.
# Build and test only through `run.sh`: it builds each arm with platform-tools
# v1.54 (whose cargo reads the edition2024 manifests in this tree), places the .so
# where `mollusk_for` looks, and runs each arm's test binary.
#
# Cargo.lock pins every crate below, at releases published at least 14 days before
# the template shipped. Keep it with the crate: run.sh copies it into the scratch
# build and back. A crate you add keeps those pins; when it needs a newer release of
# a pinned one, move only that pin with run.sh's UPDATE_PINS. mollusk-svm 0.14 and
# later need solana-account 4 and solana-rent 4, here and in shared-test-utils.
mollusk-svm = "0.13"
solana-sdk = "3"
solana-account = "3"
# The shared harness (bring-up helper, fixtures, assert macros). RELATIVE PATH —
# it is copied alongside this crate, so the path stays `./shared-test-utils`.
shared-test-utils = { path = "shared-test-utils" }
