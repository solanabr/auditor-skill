[package]
name = "audit-logs"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Offline profiler for Solana getTransaction JSONL corpora: profile, frames and deltas, as scripts/dnr computes them."
license = "MIT"
publish = false

[[bin]]
name = "audit-logs"
path = "src/main.rs"

# One dependency, libc, already in the workspace lockfile, for openat, linkat and
# unlinkat, without its default features, as audit-scan and audit-mem get it (through
# sha2 and cpufeatures). The JSON reader, the number formats and the exact integers
# are written here, so the output matches the scripts byte for byte.
[dependencies]
libc = { version = "0.2", default-features = false }
