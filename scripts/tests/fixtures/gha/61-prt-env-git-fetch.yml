# Fixture: pull_request_target passes the PR head SHA to a script through an env variable; the script fetches and builds it.
name: f61-prt-env-git-fetch
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - run: git fetch origin "$HEAD_SHA" && git checkout FETCH_HEAD && npm ci && npm run build
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
