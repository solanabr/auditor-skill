# Fixture: gated issue_comment workflow; one job returns the PR as JSON and the next job checks out its head SHA.
name: f71-comment-fromjson-job-output
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  pr:
    if: github.event.issue.pull_request && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.lookup.outputs.json }}
    steps:
      - id: lookup
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number })
            core.setOutput('json', JSON.stringify(data))
  test:
    needs: pr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ fromJSON(needs.pr.outputs.json).head.sha }}
      - run: make test
