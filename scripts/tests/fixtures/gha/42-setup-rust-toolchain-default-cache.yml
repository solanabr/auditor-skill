# Fixture: tag-triggered release job on a Rust toolchain setup action that caches build artifacts by default.
name: f42-setup-rust-toolchain-default-cache
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo build --release && ./scripts/publish.sh
