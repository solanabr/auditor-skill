# Fixture: whole event payload dumped into a shell step through tojson (lower case).
name: f50-tojson-lowercase-event
on:
  pull_request_target:
    types: [opened]
permissions:
  contents: read
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - run: echo '${{ tojson(github.event) }}' > event.json
