# Fixture: gated issue_comment job looks up the PR head in a step and checks out that step output (unquoted).
name: f22-comment-step-output-head-sha
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  test:
    if: github.event.issue.pull_request && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number })
            core.setOutput('head_sha', data.head.sha)
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
      - run: make test
