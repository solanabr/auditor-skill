# Fixture: bot deny-list compared against github.actor; the app/<slug> entries can never match.
name: f13-app-slug-denylist
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  audit:
    if: github.actor != 'dependabot[bot]' && github.actor != 'app/github-actions' && github.actor != 'app/mergify'
    runs-on: ubuntu-latest
    steps:
      - run: echo "human PR audit"
