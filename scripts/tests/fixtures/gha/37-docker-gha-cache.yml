# Fixture: tag-triggered image release reads and writes the Docker layer cache in the Actions cache (type=gha).
name: f37-docker-gha-cache
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/example/indexer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
