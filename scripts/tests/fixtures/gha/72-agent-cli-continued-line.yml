# Fixture: agent CLI started from a run: block whose command continues over lines; it has no actor check of its own.
name: f72-agent-cli-continued-line
on:
  pull_request_target:
    types: [opened]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - run: |
          claude \
            --model sonnet \
            -p "Review the change in this pull request"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
