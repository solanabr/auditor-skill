# Fixture: privileged workflow_run job checks out the triggering run's head branch and pushes; branch-name gate.
name: f05-workflow-run-head-checkout
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
permissions:
  contents: write
jobs:
  sync:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
      - run: ./scripts/sync.sh && git push
