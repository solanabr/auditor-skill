# Fixture: agent CLI started from run: with --print, which has no actor check of its own.
name: f34-agent-cli-print
on:
  pull_request_target:
    types: [opened]
permissions:
  contents: read
  pull-requests: write
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - run: claude --print "Summarize the change in this pull request"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
