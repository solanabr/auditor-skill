# Fixture: pull_request_target puts the PR head SHA in a job env variable and checks out env.HEAD_SHA.
name: f52-prt-env-head-sha
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ env.HEAD_SHA }}
      - run: npm ci && npm test
