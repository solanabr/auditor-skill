# Fixture: pull_request_target gate runs contains() on github.actor, a substring test on whoever last acted on the PR.
name: f27-actor-contains-gate
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: write
  pull-requests: write
jobs:
  automerge:
    if: contains(github.actor, 'dependabot')
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
