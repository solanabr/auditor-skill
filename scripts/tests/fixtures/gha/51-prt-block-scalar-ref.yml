# Fixture: pull_request_target checks out the PR head through a folded block scalar, the expression on the line below ref:.
name: f51-prt-block-scalar-ref
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: >-
            ${{ github.event.pull_request.head.sha }}
      - run: npm ci && npm test
