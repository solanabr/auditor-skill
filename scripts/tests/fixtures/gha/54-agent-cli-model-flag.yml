# Fixture: agent CLI started from run: with an option before -p; it has no actor check of its own.
name: f54-agent-cli-model-flag
on:
  pull_request_target:
    types: [opened]
permissions:
  contents: read
  pull-requests: write
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - run: claude --model sonnet -p "Summarize the change in this pull request"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
