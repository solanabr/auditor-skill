# Fixture: tag-triggered release job on actions/setup-go v5, which restores and saves the Go cache by default.
name: f38-setup-go-default-cache
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go build ./cmd/relayer && ./scripts/publish.sh
