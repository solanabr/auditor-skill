# Fixture: comment-triggered workflow saved with the .yaml extension, gated on the commenter's own association.
name: f59-yaml-extension-gated
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
jobs:
  deploy:
    if: startsWith(github.event.comment.body, '/deploy') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - run: echo deploy
