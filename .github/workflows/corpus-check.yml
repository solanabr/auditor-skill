name: corpus-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  corpus:
    # Branch protection requires this job by its name; keep "counts, index, version, hygiene" as it is.
    name: counts, index, version, hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (full history for the commit-message check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Corpus counts, index links, version agreement and submodule pins
        run: bash scripts/check-corpus.sh

      - name: Command, agent and skill frontmatter read as written
        if: ${{ !cancelled() }}
        run: bash scripts/check-frontmatter.sh

      - name: No pipe into a reader that stops early under pipefail
        if: ${{ !cancelled() }}
        run: bash scripts/check-pipefail.sh

      - name: Every allow rule names a listed entry point, and each keeps the contract
        if: ${{ !cancelled() }}
        run: bash scripts/check-entrypoints.sh

      - name: Clear the agent sockets and container config the runner image ships
        if: ${{ !cancelled() }}
        run: |
          # The image starts gpg-agent, dirmngr and keyboxd on sockets under /run/user/<uid>/gnupg and ships a
          # Docker config. No key sits behind them here, but scripts/lib/isolation.sh counts both, and
          # test-dnr-poc-runner needs a runner that passes its self-check so that the isolated-mode checks run.
          systemctl --user stop dirmngr.socket gpg-agent.socket gpg-agent-browser.socket gpg-agent-extra.socket \
            gpg-agent-ssh.socket keyboxd.socket 2>/dev/null || true
          gpgconf --kill all 2>/dev/null || true
          rm -f "/run/user/$(id -u)/gnupg/"S.* "$HOME/.docker/config.json" "$HOME/.kube/config"

      - name: Script self-tests (every suite runs; the step fails at the end if any failed)
        if: ${{ !cancelled() }}
        env:
          REQUIRE_TOOLCHAIN: "1"
        run: |
          failed=""
          for t in scripts/tests/*.sh; do
            echo "::group::$t"
            bash "$t" || { echo "::error::$t failed"; failed="$failed $t"; }
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "failed suites:$failed"; exit 1; fi

      - name: Repository hygiene (no env / state / local assistant files, no plugin-root load surface tracked)
        if: ${{ !cancelled() }}
        run: bash scripts/check-hygiene.sh

      - name: No AI-attribution trailers in PR commits
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/check-attribution.sh "origin/${BASE_REF}..HEAD"

  corpus-macos:
    # Advisory: do not add this job to the required checks. It runs the same checks, except the pull-request
    # attribution check, under macOS /bin/bash 3.2 with BSD sed, grep and awk. Every step sets a stock macOS PATH
    # plus ~/.cargo/bin, which the stock-toolchain step asserts, so no tool from the runner image's Homebrew
    # stands in for the system one. The image ships without cargo and rustup at times; the two steps before that
    # one then install them into ~/.cargo with rustup.
    name: macOS, bash 3.2 and BSD tools (advisory)
    runs-on: macos-26
    timeout-minutes: 30
    concurrency:   # a newer push to the same ref cancels this job's older run
      group: corpus-macos-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -e {0}
    env:
      REQUIRE_TOOLCHAIN: "1"
      # The install step's action writes CARGO_TERM_COLOR=always and CARGO_INCREMENTAL=0 to GITHUB_ENV when they
      # are unset. Set here, both hold for every step whether or not it ran, and cargo's build log stays plain
      # for the suites that check it for a ^warning line.
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Look for cargo and rustup in ~/.cargo/bin
        id: rust
        run: |
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.cargo/bin"
          if command -v cargo >/dev/null && command -v rustup >/dev/null; then echo "missing=false" >> "$GITHUB_OUTPUT"
          else echo "missing=true" >> "$GITHUB_OUTPUT"; fi

      - name: Install cargo and rustup (stable) when the image lacks them
        if: ${{ !cancelled() && steps.rust.outputs.missing == 'true' }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Stock toolchain (bash 3.2, BSD sed / grep / awk, Apple git, python3, jq, cargo, rustup)
        run: |
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.cargo/bin"
          bad=0
          [ "$(command -v bash)" = /bin/bash ] && [ "$(bash -c 'echo "${BASH_VERSINFO[0]}"')" = 3 ] \
            || { echo "::error::bash is $(command -v bash), not /bin/bash 3.2"; bad=1; }
          for t in sed grep awk find xargs git python3 jq; do
            [ "$(command -v "$t")" = "/usr/bin/$t" ] || { echo "::error::$t is '$(command -v "$t")', not /usr/bin/$t"; bad=1; }
          done
          if sed --version >/dev/null 2>&1; then echo "::error::sed is GNU sed"; bad=1; fi
          for t in cargo rustup; do
            command -v "$t" >/dev/null || { echo "::error::$t is not on PATH; the real-toolchain checks need it"; bad=1; }
          done
          for t in bash git python3 jq cargo rustup; do echo "$t: $("$t" --version 2>&1 | sed -n 1p)"; done
          exit "$bad"

      - name: Corpus counts, index links, version agreement and submodule pins
        if: ${{ !cancelled() }}
        run: |
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.cargo/bin"
          bash scripts/check-corpus.sh

      - name: Command, agent and skill frontmatter read as written
        if: ${{ !cancelled() }}
        run: |
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.cargo/bin"
          bash scripts/check-frontmatter.sh

      - name: No pipe into a reader that stops early under pipefail
        if: ${{ !cancelled() }}
        run: |
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.cargo/bin"
          bash scripts/check-pipefail.sh

      - name: Every allow rule names a listed entry point, and each keeps the contract
        if: ${{ !cancelled() }}
        run: |
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.cargo/bin"
          bash scripts/check-entrypoints.sh

      - name: Script self-tests (every suite runs; the step fails at the end if any failed)
        if: ${{ !cancelled() }}
        run: |
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.cargo/bin"
          failed=""
          for t in scripts/tests/*.sh; do
            echo "::group::$t"
            bash "$t" || { echo "::error::$t failed"; failed="$failed $t"; }
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "failed suites:$failed"; exit 1; fi

      - name: Repository hygiene (no env / state / local assistant files, no plugin-root load surface tracked)
        if: ${{ !cancelled() }}
        run: |
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.cargo/bin"
          bash scripts/check-hygiene.sh

  auditor-tools:
    # Builds the Rust tools as a user does (release, --locked) with warnings denied, runs
    # their unit tests, and checks audit-logs against the dnr scripts it mirrors.
    name: auditor-tools build and audit-logs parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Toolchain
        run: |
          for t in cargo rustc jq python3; do
            command -v "$t" >/dev/null || { echo "::error::$t is not on PATH"; exit 1; }
          done
          cargo --version; rustc --version; jq --version; python3 --version

      - name: Build tools/auditor-tools (release, locked)
        working-directory: tools/auditor-tools
        run: cargo build --release --locked

      - name: Unit tests
        if: ${{ !cancelled() }}
        working-directory: tools/auditor-tools
        run: cargo test --release --locked

      - name: audit-logs against scripts/dnr
        if: ${{ !cancelled() }}
        env:
          REQUIRE_TOOLCHAIN: "1"
          AUDIT_LOGS: tools/auditor-tools/target/release/audit-logs
        run: bash scripts/tests/test-audit-logs.sh

      - name: audit-scan and audit-mem against their hostile-argument cases
        if: ${{ !cancelled() }}
        env:
          REQUIRE_TOOLCHAIN: "1"
          AUDITOR_TOOLS_BIN: tools/auditor-tools/target/release
        run: bash scripts/tests/test-auditor-tools.sh
